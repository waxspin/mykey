[package]
name = "mykey"
version = "1.0.0"
edition = "2021"
description = "MIKEY (RFC 3830) — Multimedia Internet KEYing for SRTP key exchange"
license = "MIT OR Apache-2.0"
authors = ["Ben Bryan"]
repository = "https://github.com/waxspin/mykey"
documentation = "https://waxspin.github.io/mykey/doc/mykey/"
homepage = "https://waxspin.github.io/mykey"

[dependencies]
thiserror = "1"
rand = "0.9"
rand_core = { version = "0.6", features = ["getrandom"] }
hmac = "0.12"
sha1 = "0.10"
hex = "0.4"

# DH / ECDH key exchange
x25519-dalek = { version = "2", features = ["static_secrets"] }

# For SAP/SDP base64 encoding
base64 = "0.22"

# AES-CM key wrapping of the KEMAC payload (RFC 3830 §4.2.3)
aes = "0.9"
ctr = "0.10"

[package.metadata.release]
# cargo-release bumps Cargo.toml, but nothing in prose. The README's install
# snippet pins an explicit version, so it needs rewriting too or it ships
# pointing at the previous release.
#
# `exactly = 1` is deliberate: if the snippet is reworded so the pattern stops
# matching, the release fails loudly instead of silently leaving a stale version.
pre-release-replacements = [
  { file = "README.md", search = 'mykey = "[0-9]+\.[0-9]+\.[0-9]+"', replace = 'mykey = "{{version}}"', exactly = 1 },
  # Promote the accumulated [Unreleased] notes to a dated version heading, and
  # leave [Unreleased] in place for the next cycle's entries.
  { file = "CHANGELOG.md", search = '## \[Unreleased\]', replace = "## [Unreleased]\n\n## [{{version}}] - {{date}}", exactly = 1 },
]
